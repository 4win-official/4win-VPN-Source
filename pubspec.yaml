name: vpn_swift
description: "4win VPN - Fast, secure, multi-protocol VPN client (SSTP, OpenVPN, Xray, DNS Changer, Slow DNS, Proxy, Psiphon) with automatic server selection."
publish_to: 'none'
version: 1.5.0+30

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  http: 1.5.0
  shared_preferences: 2.5.3
  connectivity_plus: ^6.0.5
  network_info_plus: ^6.0.2
  permission_handler: ^11.3.1
  sstp_flutter:
    path: packages/sstp_flutter
  openvpn_flutter: ^1.3.3
  file_picker: ^8.0.0+1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  open_filex: ^4.5.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/snow_button_overlay.png
    - assets/icons/app_icon.png
