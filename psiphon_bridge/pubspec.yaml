name: psiphon_bridge
description: Native Android bridge for the 4win Psiphon tunnel service.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.2
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.forwin.psiphon_bridge
        pluginClass: PsiphonBridgePlugin
