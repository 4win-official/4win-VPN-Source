group 'com.forwin.psiphon_bridge'
version '0.1.0'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.forwin.psiphon_bridge'
    compileSdk 35
    defaultConfig {
        minSdk 24
    }

    // Keep Java and Kotlin on the same JVM target. Gradle's default Java
    // target for this plugin is 8, while the Kotlin compiler targets 17.
    // Align both to JDK 17 used by the Android build.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
