name: Build Android APK

on:
  # Build only when explicitly requested from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.1'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.12'

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          java -version
          cd android
          curl -fsSL https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Prepare stripped Psiphon AAR
        shell: bash
        run: |
          set -euo pipefail
          aar=$(find "$HOME/.gradle/caches" -type f -iname "*psiphon*.aar" | head -n 1 || true)
          if [ -z "$aar" ]; then echo "Psiphon AAR not found"; exit 0; fi
          work=$(mktemp -d); unzip -q "$aar" -d "$work"
          rm -rf "$work/jni"/\*/libgomobile.so "$work/jni"/\*/libgojni.so 2>/dev/null || true
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "$work/jni/$abi/libgojni.so" ]; then mv "$work/jni/$abi/libgojni.so" "$work/jni/$abi/libpsiphon-gojni.so"; fi
          done
          out="android/app/libs/psiphon-stripped.aar"; mkdir -p "$(dirname "$out")"
          (cd "$work" && zip -qr "$OLDPWD/$out" .)

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4win-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
