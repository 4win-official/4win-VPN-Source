name: Build Android APK

on:
  # Build only when explicitly requested from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.1'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.12'

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          java -version
          cd android
          curl -fsSL https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Prepare Psiphon AAR without duplicate gomobile runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/libs
          curl -fsSL \
            "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/v2.0.40/ca/psiphon/psiphontunnel/2.0.40/psiphontunnel-2.0.40.aar" \
            -o /tmp/psiphontunnel.aar
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from io import BytesIO

          src = Path('/tmp/psiphontunnel.aar')
          dst = Path('android/app/libs/psiphontunnel-2.0.40-stripped.aar')

          with ZipFile(src, 'r') as aar:
              entries = {info.filename: aar.read(info.filename) for info in aar.infolist()}

          classes = entries['classes.jar']
          with ZipFile(BytesIO(classes), 'r') as jar:
              jar_entries = {info.filename: jar.read(info.filename) for info in jar.infolist()}

          stripped_classes = BytesIO()
          with ZipFile(stripped_classes, 'w', ZIP_DEFLATED) as jar:
              for name, data in jar_entries.items():
                  if name.startswith('go/'):
                      continue
                  jar.writestr(name, data)
          entries['classes.jar'] = stripped_classes.getvalue()

          native_names = []
          for name in list(entries):
              if name.startswith('jni/') and name.endswith('/libgojni.so'):
                  new_name = name[:-len('libgojni.so')] + 'libpsiphon-gojni.so'
                  entries[new_name] = entries.pop(name)
                  native_names.append(new_name)

          if len(native_names) != 4:
              raise SystemExit(f'Expected 4 Psiphon native libraries, found {len(native_names)}: {native_names}')

          with ZipFile(dst, 'w', ZIP_DEFLATED) as aar:
              for name, data in entries.items():
                  aar.writestr(name, data)

          print(f'Prepared {dst}')
          print('Native libraries:', ', '.join(native_names))
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4win-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
