name: Flutter Tests

# Fast unit/widget test gate: runs on every push (any branch) and PR, so
# broken Dart code is caught in ~2 minutes without waiting for the full APK
# build. No JDK/Android SDK needed (pure `flutter test`).
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (warnings only, never blocks)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests
        run: flutter test --reporter expanded 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-output
          path: test-output.txt
          retention-days: 7
