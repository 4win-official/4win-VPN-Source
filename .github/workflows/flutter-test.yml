name: Flutter Tests

# Fast unit/widget test gate: runs on every push (any branch), so
# broken Dart code is caught in ~2 minutes without waiting for the full APK
# build. No JDK/Android SDK needed (pure `flutter test`).
on:
  # NOTE: no `pull_request` trigger on purpose — for same-repo branches the
  # push run already appears on the PR, so a PR trigger would only duplicate
  # every run. One push = one run; cancel-in-progress kills the older one.
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (warnings only, never blocks)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests
        run: flutter test --reporter expanded 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-output
          path: test-output.txt
          retention-days: 7

      # Posts the real failure lines as a commit comment so they are readable
      # even when workflow logs/artifacts are unreachable from the sandbox.
      - name: Report failures on commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/fail_body.md
          try:
              text = open('test-output.txt', encoding='utf-8', errors='replace').read()
          except OSError:
              text = '(no test-output.txt captured)'
          lines = text.splitlines()
          markers = ('[E]', 'FAILED', 'Test failed', 'EXCEPTION CAUGHT', 'Compilation failed', ': Error:')
          err_idx = [i for i, l in enumerate(lines) if any(m in l for m in markers)]
          out = ['## ❌ Flutter test failures', '']
          if not err_idx:
              out += ['(no failure markers found — tail of output:)', '', '```']
              out += lines[-60:]
              out += ['```']
          else:
              out += ['```']
              shown = set()
              for i in err_idx[:3]:
                  for j in range(max(0, i - 2), min(len(lines), i + 25)):
                      if j not in shown:
                          shown.add(j)
                          out.append(lines[j])
                  out.append('…')
              out += ['```', '', '--- tail ---', '```']
              out += lines[-15:]
              out += ['```']
          print('\n'.join(out)[:30000])
          PY
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat /tmp/fail_body.md)" > /dev/null && echo reported
