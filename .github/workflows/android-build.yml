name: Android Build

on:
  # Build only when explicitly requested from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the stable version that built this repo green on
          # 2026-09-09 (unpinned `channel: stable` silently moves under CI).
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Verify Android app resources
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/res/values/strings.xml
          grep -q 'name="app_name"' android/app/src/main/res/values/strings.xml
          echo "app_name resource is present"

      # NOTE: the Psiphon AAR relocation (go -> gi bridge, libgojni ->
      # libpsiphon-gojni with symbol/FindClass patching) now happens inside
      # the Gradle build itself (android/app/build.gradle.kts
      # `relocatePsiphonAar` task + tools/relocate_psiphon_aar.py), so local
      # builds and CI produce byte-identical runtimes. Nothing to prepare here.

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Set up Rust for Aether WARP
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build-log.txt

      # The Gradle error text is posted as a commit comment so the real
      # failure reason is readable from the API even when job logs are not.
      - name: Report build failure on commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fail_body.md
          try:
              text = open('/tmp/build-log.txt', encoding='utf-8', errors='replace').read()
          except OSError:
              text = '(no build log captured)'
          lines = text.splitlines()
          markers = ('error:', 'Error:', 'FAILURE', 'What went wrong',
                     'Could not', 'Exception', 'Execution failed',
                     'Unresolved reference', 'e: ')
          err_idx = [i for i, l in enumerate(lines) if any(m in l for m in markers)]
          out = ['## ❌ Android build failure', '']
          seen = set()
          shown = 0
          for i in err_idx:
              if i in seen or shown > 60:
                  continue
              for j in range(max(0, i - 2), min(len(lines), i + 12)):
                  if j not in seen:
                      seen.add(j)
                      out.append(lines[j])
                      shown += 1
              out.append('…')
          if shown == 0:
              out += ['(no error markers found — tail of output:)', '', '```']
              out += lines[-60:]
              out += ['```']
          else:
              out += ['--- tail ---', '```'] + lines[-20:] + ['```']
          print('\n'.join(out)[:30000])
          PY
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/fail_body.md)" > /dev/null && echo reported

      - name: Verify Psiphon runtime isolation in APK
        run: python3 tools/verify_apk_psiphon.py build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Psiphon runtime isolation in APK
        run: python3 tools/verify_apk_psiphon.py build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4win-vpn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
