name: Android Build

on:
  # Auto-build on EVERY push (any branch), plus manual dispatch.
  # NOTE: no `pull_request` trigger on purpose — for same-repo branches the
  # push run already appears on the PR, so a PR trigger would only duplicate
  # every run. One push = one run; cancel-in-progress kills the older one.
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Android app resources
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/res/values/strings.xml
          grep -q 'name="app_name"' android/app/src/main/res/values/strings.xml
          echo "app_name resource is present"

      # NOTE: the Psiphon AAR relocation (go -> gi bridge, libgojni ->
      # libpsiphon-gojni with symbol/FindClass patching) now happens inside
      # the Gradle build itself (android/app/build.gradle.kts
      # `relocatePsiphonAar` task + tools/relocate_psiphon_aar.py), so local
      # builds and CI produce byte-identical runtimes. Nothing to prepare here.

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify Psiphon runtime isolation in APK
        run: python3 tools/verify_apk_psiphon.py build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4win-vpn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
