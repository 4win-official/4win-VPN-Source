name: Android Build

on:
  # Build only when explicitly requested from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep aligned with Flutter 3.47.3's flutter.ndkVersion.
  FLUTTER_NDK_VERSION: '28.2.13676358'

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the stable version that built this repo green on
          # 2026-09-09 (unpinned `channel: stable` silently moves under CI).
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Verify Android app resources
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/res/values/strings.xml
          grep -q 'name="app_name"' android/app/src/main/res/values/strings.xml
          echo "app_name resource is present"

      # NOTE: the Psiphon AAR relocation (go -> gi bridge, libgojni ->
      # libpsiphon-gojni with symbol/FindClass patching) now happens inside
      # the Gradle build itself (android/app/build.gradle.kts
      # `relocatePsiphonAar` task + tools/relocate_psiphon_aar.py), so local
      # builds and CI produce byte-identical runtimes. Nothing to prepare here.

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Set up Rust for Aether WARP
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk usage before cleanup:'
          df -h /
          # Emulator binaries and system images are not used by this build.
          sudo rm -rf "$ANDROID_HOME/system-images" "$ANDROID_HOME/emulator"
          # Aether is built with NDK 26.3; Gradle uses Flutter's exact pinned
          # NDK. Do not infer the latter from directory timestamps: removing it
          # forces a large SDK download during Gradle, where a corrupt archive
          # previously failed with "Archive is not a ZIP archive".
          keep_ndks=("$ANDROID_HOME/ndk/26.3.11579264" \
            "$ANDROID_HOME/ndk/$FLUTTER_NDK_VERSION")
          for ndk in "$ANDROID_HOME"/ndk/*; do
            [[ -d "$ndk" ]] || continue
            keep=false
            for wanted in "${keep_ndks[@]}"; do
              [[ "$ndk" == "$wanted" ]] && keep=true
            done
            [[ "$keep" == true ]] || sudo rm -rf "$ndk"
          done
          echo 'Disk usage after cleanup:'
          df -h /

      - name: Ensure Flutter Android NDK is installed
        shell: bash
        run: |
          set -euo pipefail
          ndk_dir="$ANDROID_HOME/ndk/$FLUTTER_NDK_VERSION"
          revision_file="$ndk_dir/source.properties"
          if [[ -f "$revision_file" ]] && \
             grep -Fxq "Pkg.Revision = $FLUTTER_NDK_VERSION" "$revision_file"; then
            echo "NDK $FLUTTER_NDK_VERSION is already installed"
            exit 0
          fi

          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f \
              -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo 'Could not find an executable Android sdkmanager' >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Installing NDK $FLUTTER_NDK_VERSION (attempt $attempt/3)"
            if [[ "$attempt" -gt 1 ]]; then
              sudo rm -rf "$ndk_dir" "$ANDROID_HOME/.temp"
            fi
            if "$sdkmanager" --sdk_root="$ANDROID_HOME" \
                --install "ndk;$FLUTTER_NDK_VERSION" && \
               [[ -f "$revision_file" ]] && \
               grep -Fxq "Pkg.Revision = $FLUTTER_NDK_VERSION" "$revision_file"; then
              echo "NDK $FLUTTER_NDK_VERSION is ready"
              exit 0
            fi
            echo "NDK installation attempt $attempt failed; retrying if possible" >&2
            sleep "$((attempt * 10))"
          done
          echo "Failed to install a valid NDK $FLUTTER_NDK_VERSION after 3 attempts" >&2
          exit 1

      - name: Build Aether native libraries for universal APK
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "Building Aether for ${abi}"
            bash core/build-android.sh --abi "${abi}"
          done
          echo "Aether libraries staged in android/app/src/main/jniLibs"
          find android/app/src/main/jniLibs -path '*/libaether.so' -print
          # Cargo intermediates are no longer needed once libaether.so files
          # have been copied; reclaim the space before Gradle packageRelease.
          rm -rf "$HOME/.cargo/registry/cache" "$HOME/.cargo/git/checkouts"
          echo 'Disk usage after Aether build:'
          df -h /

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          # No --split-per-abi: this intentionally creates one universal APK
          # containing all native ABIs, including Aether WARP.
          flutter build apk --release 2>&1 | tee /tmp/build-log.txt

      # The Gradle error text is posted as a commit comment so the real
      # failure reason is readable from the API even when job logs are not.
      - name: Report build failure on commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fail_body.md
          try:
              text = open('/tmp/build-log.txt', encoding='utf-8', errors='replace').read()
          except OSError:
              text = '(no build log captured)'
          lines = text.splitlines()
          markers = ('error:', 'Error:', 'FAILURE', 'What went wrong',
                     'Could not', 'Exception', 'Execution failed',
                     'Unresolved reference', 'e: ')
          err_idx = [i for i, l in enumerate(lines) if any(m in l for m in markers)]
          out = ['## ❌ Android build failure', '']
          seen = set()
          shown = 0
          for i in err_idx:
              if i in seen or shown > 60:
                  continue
              for j in range(max(0, i - 2), min(len(lines), i + 12)):
                  if j not in seen:
                      seen.add(j)
                      out.append(lines[j])
                      shown += 1
              out.append('…')
          if shown == 0:
              out += ['(no error markers found — tail of output:)', '', '```']
              out += lines[-60:]
              out += ['```']
          else:
              out += ['--- tail ---', '```'] + lines[-20:] + ['```']
          print('\n'.join(out)[:30000])
          PY
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/fail_body.md)" > /dev/null && echo reported

      - name: Verify Psiphon runtime isolation in APK
        run: python3 tools/verify_apk_psiphon.py build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Psiphon runtime isolation in APK
        run: python3 tools/verify_apk_psiphon.py build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4win-vpn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
