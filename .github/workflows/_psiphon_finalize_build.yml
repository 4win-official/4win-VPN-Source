name: Finalize Psiphon Integration And Build

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.12'

jobs:
  finalize-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Psiphon integration
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/providers/vpn_provider.dart')
          s = p.read_text()

          s = s.replace("import '../services/proxy_service.dart';", "import '../services/proxy_service.dart';\nimport '../services/psiphon_service.dart';")
          s = s.replace("  final ProxyServerService _proxyService = ProxyServerService();", "  final ProxyServerService _proxyService = ProxyServerService();\n  final PsiphonService _psiphonService = PsiphonService();\n  Timer? _psiphonMonitorTimer;")
          s = s.replace("String _selectedProtocol = 'xray';", "String _selectedProtocol = 'psiphon';")
          s = s.replace("          _selectedProtocol == 'openvpn')", "          _selectedProtocol == 'openvpn' ||\n          _selectedProtocol == 'psiphon')")

          old = """  Future<void> _startupRestore() async {\n    await loadSelectedProtocol();\n    try {\n      await loadOpenVpnConfigs();\n    } catch (_) {}\n  }"""
          new = """  Future<void> _startupRestore() async {\n    await loadSelectedProtocol();\n    try {\n      final prefs = await SharedPreferences.getInstance();\n      // One-time migration: Psiphon is the new default protocol. After this\n      // migration the user's later protocol choices are preserved normally.\n      final migrated = prefs.getBool('psiphon_default_v1') ?? false;\n      if (!migrated) {\n        _selectedProtocol = 'psiphon';\n        await _dnsService.setSelectedProtocol('psiphon');\n        await prefs.setBool('psiphon_default_v1', true);\n        notifyListeners();\n      }\n    } catch (_) {}\n    try {\n      await loadOpenVpnConfigs();\n    } catch (_) {}\n  }"""
          if old not in s:
              raise SystemExit('startupRestore marker not found')
          s = s.replace(old, new, 1)

          marker = """    // 🔀 PROTOCOL DETECTION: Direct DNS, OpenVPN, Slow DNS, or SSTP\n    if (_selectedProtocol == 'direct_dns') {"""
          repl = """    // 🔀 PROTOCOL DETECTION: Psiphon, Direct DNS, OpenVPN, Slow DNS, or SSTP\n    if (_selectedProtocol == 'psiphon') {\n      await _connectPsiphon();\n      return;\n    } else if (_selectedProtocol == 'direct_dns') {"""
          if marker not in s:
              raise SystemExit('connect dispatch marker not found')
          s = s.replace(marker, repl, 1)

          marker = """  /// Connect via Direct DNS (separate from SSTP)\n  Future<void> _connectDirectDns() async {"""
          method = r'''  /// Connect through the official Psiphon Android MobileLibrary.\n  /// The native service owns the tunnel; this layer only coordinates UI state\n  /// and performs a lightweight post-connect liveness check.\n  Future<void> _connectPsiphon() async {\n    try {\n      _status = VpnConnectionStatus.connecting;\n      _errorMessage = null;\n      notifyListeners();\n\n      final started = await _psiphonService.start();\n      if (!started) {\n        _status = VpnConnectionStatus.error;\n        _errorMessage = 'Unable to start Psiphon VPN service';\n        notifyListeners();\n        return;\n      }\n\n      // Give Psiphon time to obtain a server and establish the tunnel.\n      for (var i = 0; i < 60; i++) {\n        await Future<void>.delayed(const Duration(seconds: 1));\n        if (_selectedProtocol != 'psiphon' ||\n            _status == VpnConnectionStatus.disconnected ||\n            _status == VpnConnectionStatus.disconnecting) {\n          return;\n        }\n        if (await _psiphonService.isConnected) {\n          _status = VpnConnectionStatus.connected;\n          _connectedServer = null;\n          _errorMessage = null;\n          _startDurationTimer();\n          _startPingTimer();\n          _startPsiphonMonitor();\n          notifyListeners();\n          return;\n        }\n      }\n\n      _status = VpnConnectionStatus.error;\n      _errorMessage = 'Psiphon connection timed out';\n      notifyListeners();\n    } catch (e) {\n      _status = VpnConnectionStatus.error;\n      _errorMessage = 'Psiphon connection failed: $e';\n      notifyListeners();\n    }\n  }\n\n  void _startPsiphonMonitor() {\n    _psiphonMonitorTimer?.cancel();\n    _psiphonMonitorTimer = Timer.periodic(const Duration(seconds: 20), (_) async {\n      if (_selectedProtocol != 'psiphon' ||\n          _status != VpnConnectionStatus.connected) {\n        return;\n      }\n      try {\n        final healthy = await _psiphonService.isConnected;\n        if (healthy) return;\n        if (_status != VpnConnectionStatus.connected) return;\n        _status = VpnConnectionStatus.connecting;\n        notifyListeners();\n        await _psiphonService.reconnect();\n        for (var i = 0; i < 15; i++) {\n          await Future<void>.delayed(const Duration(seconds: 1));\n          if (await _psiphonService.isConnected) {\n            _status = VpnConnectionStatus.connected;\n            _startDurationTimer();\n            notifyListeners();\n            return;\n          }\n        }\n        _status = VpnConnectionStatus.error;\n        _errorMessage = 'Psiphon connection lost';\n        notifyListeners();\n      } catch (_) {}\n    });\n  }\n\n  void _stopPsiphonMonitor() {\n    _psiphonMonitorTimer?.cancel();\n    _psiphonMonitorTimer = null;\n  }\n\n  /// Connect via Direct DNS (separate from SSTP)\n  Future<void> _connectDirectDns() async {'''
          # Raw string above contains escaped newlines by design; normalize them.
          method = method.replace('\\n', '\n')
          if marker not in s:
              raise SystemExit('direct DNS marker not found')
          s = s.replace(marker, method, 1)

          marker = """      if (_selectedProtocol == 'direct_dns') {\n        await DnsVpnConnection.disconnect();"""
          # Insert Psiphon disconnect branch immediately before Direct DNS branch.
          repl = """      if (_selectedProtocol == 'psiphon') {\n        _stopPsiphonMonitor();\n        await _psiphonService.stop();\n        _stopPingTimer();\n        _stopDurationTimer();\n        _connectionDuration = Duration.zero;\n        _totalDownloadBytes = 0;\n        _totalUploadBytes = 0;\n        if (kDebugMode) debugPrint('🔌 Disconnecting Psiphon...');\n      } else if (_selectedProtocol == 'direct_dns') {\n        await DnsVpnConnection.disconnect();"""
          if marker not in s:
              raise SystemExit('disconnect marker not found')
          s = s.replace(marker, repl, 1)

          s = s.replace("    _stopXrayTraffic();\n    _vpnService.dispose();", "    _stopXrayTraffic();\n    _stopPsiphonMonitor();\n    _vpnService.dispose();")

          p.write_text(s)

          # New installs and installs without a saved selection use Psiphon.
          p = Path('lib/services/dns_service.dart')
          s = p.read_text().replace("return prefs.getString(selectedProtocolKey) ?? 'xray'; // پیش‌فرض Xray", "return prefs.getString(selectedProtocolKey) ?? 'psiphon'; // پیش‌فرض Psiphon")
          p.write_text(s)

          # Ensure Psiphon uses the shared split-tunneling configuration.
          p = Path('android/app/src/main/kotlin/com/forwin/vpn/PsiphonVpnService.kt')
          s = p.read_text()
          old = """                    .addDnsServer(\"8.8.8.8\")\n                    .setBlocking(false)\n                    .establish()"""
          new = """                    .addDnsServer(\"8.8.8.8\")\n                    .setBlocking(false)\n                SplitTunnel.apply(applicationContext, builder, packageName)\n                val vpn = builder.establish()"""
          # Replace the complete Builder chain declaration to avoid duplicate `val vpn`.
          old2 = """                val vpn = Builder()\n                    .setSession(\"4win Psiphon\")\n                    .setMtu(1500)\n                    .addAddress(\"10.2.0.2\", 32)\n                    .addRoute(\"0.0.0.0\", 0)\n                    .addRoute(\"::\", 0)\n                    .addDnsServer(\"1.1.1.1\")\n                    .addDnsServer(\"8.8.8.8\")\n                    .setBlocking(false)\n                    .establish()"""
          new2 = """                val builder = Builder()\n                    .setSession(\"4win Psiphon\")\n                    .setMtu(1500)\n                    .addAddress(\"10.2.0.2\", 32)\n                    .addRoute(\"0.0.0.0\", 0)\n                    .addRoute(\"::\", 0)\n                    .addDnsServer(\"1.1.1.1\")\n                    .addDnsServer(\"8.8.8.8\")\n                    .setBlocking(false)\n                SplitTunnel.apply(applicationContext, builder, packageName)\n                val vpn = builder.establish()"""
          if old2 not in s:
              raise SystemExit('Psiphon Builder marker not found')
          p.write_text(s.replace(old2, new2, 1))

      - name: Verify source changes
        run: |
          grep -q "protocol: 'psiphon'" lib/widgets/protocol_selector_dialog.dart
          grep -q "Future<void> _connectPsiphon" lib/providers/vpn_provider.dart
          grep -q "_psiphonService.start" lib/providers/vpn_provider.dart
          grep -q "SplitTunnel.apply" android/app/src/main/kotlin/com/forwin/vpn/PsiphonVpnService.kt

      - name: Commit finalized source and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/vpn_provider.dart lib/services/dns_service.dart android/app/src/main/kotlin/com/forwin/vpn/PsiphonVpnService.kt
          git rm .github/workflows/_psiphon_finalize_build.yml
          git commit -m "feat: finalize Psiphon protocol and selector"
          git push origin HEAD:main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          java -version
          cd android
          curl -fsSL https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4win-android-release-apk-psiphon
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
